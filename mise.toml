#:schema https://mise.jdx.dev/schema/mise.json

[tools]
hk = "2.12"
rumdl = "0.3.3"
lychee = "0.24.2"
typos = "1"
gitleaks = "8"
cargo-deny = "0.20.2"
"github:huacnlee/autocorrect" = "2.16.3"
"github:1jehuang/mermaid-rs-renderer" = "0.3.1"

[tasks.check]
description = "Run all documentation, formatting, clippy, and test checks"
run = "hk check --all --silent -n"

[tasks.fmt]
description = "Auto-fix documentation formatting, typography, and Rust code formatting"
run = "hk fix --all --silent -n"
