# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

cache-mode: read
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Path Filter
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # Read changed files for dorny/paths-filter on PRs
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      code: ${{ steps.filter.outputs.code == 'true' && !startsWith(github.head_ref, 'release-please--') }}
      deps: ${{ steps.filter.outputs.deps == 'true' && !startsWith(github.head_ref, 'release-please--') }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' && !startsWith(github.head_ref, 'release-please--') }}
      release_pr: ${{ startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/*.json'
              - '!.github/.*.json'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/codeql/**'
            deps:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'deny.toml'
            workflows:
              - '.github/workflows/**'

  docs:
    name: Docs Checks
    needs: plan
    if: ${{ github.event_name == 'pull_request' && needs.plan.outputs.release_pr != 'true' && (needs.plan.outputs.docs == 'true' || needs.plan.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: --locked
          cache_save: false
      - name: Run docs checks
        run: hk check --all -q -n -p docs

  checks:
    name: Checks
    needs: plan
    if: ${{ github.event_name == 'merge_group' && needs.plan.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        id: rustup
        background: true
        run: rustup install --profile minimal
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: --locked
          cache_save: false
      - name: Wait for Rust toolchain
        wait: rustup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-checks
          save-if: false
      - name: Run code checks
        run: hk check --all -q -n -p code

  security:
    name: Security
    needs: plan
    if: ${{ (github.event_name == 'pull_request' && needs.plan.outputs.release_pr != 'true') || needs.plan.outputs.deps == 'true' || needs.plan.outputs.workflows == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: --locked
          cache_save: false
      - name: Audit workflows
        if: ${{ needs.plan.outputs.workflows == 'true' }}
        run: hk check --all -q -n -p security
      - name: Scan PR commits for leaked secrets
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if git rev-parse --verify -q HEAD^2 >/dev/null; then
            opts="HEAD^1..HEAD^2"
          else
            opts="-n 1"
          fi
          gitleaks git --no-banner --log-level warn --redact --log-opts="$opts" .
      - name: Audit dependencies
        if: ${{ needs.plan.outputs.deps == 'true' }}
        env:
          RUSTUP_TOOLCHAIN: stable
        run: mise run audit

  gate:
    name: Merge Gate
    needs: [plan, docs, checks, security]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify required checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            exit 1
          fi
          for r in "$DOCS_RESULT" "$CHECKS_RESULT" "$SECURITY_RESULT"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              exit 1
            fi
          done
