# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release

on:
  push:
    branches:
      - main

env:
  PKG_NAME: ${{ github.event.repository.name }}
  NPM_SCOPE: "@taitide"
  HOMEBREW_TAP: "taitide-labs/homebrew-tap"

permissions: {}

concurrency:
  group: release-main
  queue: max

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create release tags and draft releases
      pull-requests: write # Create and update release PRs
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  test:
    name: Test Release Target (${{ matrix.target }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        id: rustup
        shell: bash
        background: true
        env:
          TARGET: ${{ matrix.target }}
        run: rustup install --profile minimal && rustup target add "$TARGET"
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install: false
          cache_save: false
      - name: Install test runner
        shell: bash
        run: mise install --locked "github:nextest-rs/nextest"
      - name: Wait for Rust toolchain
        wait: rustup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-${{ matrix.target }}
      - name: Run cross-platform checks
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo clippy -q --workspace --all-targets --locked --target "$TARGET" -- -D warnings
          mise x -- cargo nextest run --workspace --locked --target "$TARGET" --no-tests=pass --cargo-quiet --status-level=slow --final-status-level=slow --show-progress=none

  build:
    name: Build Release Binary (${{ matrix.target }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            ext: tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            ext: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup install --profile minimal && rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: build-${{ matrix.target }}
      - name: Build binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build -p "$PKG_NAME" --release --locked --target "$TARGET"
      - name: Package artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          {
            IFS= read -r pkg_name
            IFS= read -r bin_name
          } < <(
            cargo metadata --no-deps --format-version 1 | jq -r --arg name "$PKG_NAME" '
              (.packages[] | select(.name == $name)) as $p |
              $p.name,
              ((first($p.targets[] | select(.kind | index("bin")) | .name)) // $p.name)
            '
          )
          test -n "$pkg_name" && test -n "$bin_name"
          mkdir -p dist
          if [ "$EXT" = "zip" ]; then
            7z a "dist/${pkg_name}-${TARGET}.zip" "./target/${TARGET}/release/${bin_name}.exe"
          else
            tar -C "target/${TARGET}/release" -czf "dist/${pkg_name}-${TARGET}.tar.gz" "$bin_name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  upload-assets:
    name: Upload & Attest Release Assets
    needs: [release-please, test, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Upload release assets and publish release
      id-token: write # Mint OIDC token for SLSA attestation
      attestations: write # Persist build provenance attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd artifacts
          files=(./*.tar.gz ./*.zip)
          test "${#files[@]}" -gt 0
          sha256sum -- "${files[@]#./}" > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
      - name: Upload release assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" artifacts/* --clobber
          gh release edit "$TAG" --draft=false

  publish-crates:
    name: Publish to crates.io
    needs: [release-please, upload-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC Trusted Publishing for crates.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p "$PKG_NAME" --locked

  publish-npm:
    name: Publish to npm
    needs: [release-please, upload-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC provenance publishing for npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Build and publish npm wrapper
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p npm-pkg/bin

          cargo metadata --no-deps --format-version 1 | jq \
            --arg pkg_name "$PKG_NAME" \
            --arg scope "$NPM_SCOPE" \
            --arg version "${TAG#v}" \
            '
              (.packages[] | select(.name == $pkg_name)) as $p |
              ((first($p.targets[] | select(.kind | index("bin")) | .name)) // $p.name) as $bin |
              {
                name: "\($scope)/\($p.name)",
                version: $version,
                description: ($p.description // ""),
                license: ($p.license // "MIT"),
                repository: { type: "git", url: (($p.repository | sub("/+$"; "")) + ".git") },
                bin: { ($bin): ("bin/" + $bin + ".js") },
                scripts: { postinstall: "node install.js" }
              }
            ' > npm-pkg/package.json

          bin_name=$(jq -r '.bin | keys[0]' npm-pkg/package.json)
          test -n "$bin_name"

          cat > "npm-pkg/bin/${bin_name}.js" <<'EOF'
          #!/usr/bin/env node
          const { spawnSync } = require("node:child_process");
          const path = require("node:path");
          const pkg = require("../package.json");
          const binName = Object.keys(pkg.bin)[0];
          const bin = path.join(__dirname, process.platform === "win32" ? `${binName}.exe` : binName);
          const res = spawnSync(bin, process.argv.slice(2), { stdio: "inherit" });
          if (res.error) throw res.error;
          process.exit(res.status ?? 1);
          EOF

          cat > npm-pkg/install.js <<'EOF'
          const https = require("node:https");
          const fs = require("node:fs");
          const path = require("node:path");
          const { execSync } = require("node:child_process");
          const pkg = require("./package.json");
          const map = {
            "darwin-arm64": "aarch64-apple-darwin.tar.gz",
            "linux-x64": "x86_64-unknown-linux-gnu.tar.gz",
            "linux-arm64": "aarch64-unknown-linux-gnu.tar.gz",
            "win32-x64": "x86_64-pc-windows-msvc.zip"
          };
          const suffix = map[`${process.platform}-${process.arch}`];
          if (!suffix) throw new Error(`Unsupported platform: ${process.platform}-${process.arch}`);
          const pkgBase = pkg.name.split("/").pop();
          const repoUrl = pkg.repository.url.replace(/\.git$/, "");
          const url = `${repoUrl}/releases/download/v${pkg.version}/${pkgBase}-${suffix}`;
          const out = path.join(__dirname, "bin", suffix);
          function download(u, cb) {
            https.get(u, (res) => {
              if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                return download(res.headers.location, cb);
              }
              if (res.statusCode !== 200) return cb(new Error(`HTTP ${res.statusCode}`));
              const file = fs.createWriteStream(out);
              res.pipe(file).on("finish", () => file.close(cb));
            }).on("error", cb);
          }
          download(url, (err) => {
            if (err) throw err;
            if (suffix.endsWith(".zip")) {
              execSync(`powershell -Command "Expand-Archive -Force '${out}' '${path.join(__dirname, "bin")}'"`);
            } else {
              execSync(`tar -xzf "${out}" -C "${path.join(__dirname, "bin")}"`);
            }
            fs.unlinkSync(out);
          });
          EOF

          npm publish --provenance --access public ./npm-pkg

  publish-homebrew:
    name: Update Homebrew Tap
    needs: [release-please, upload-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: false
      - name: Update Homebrew formula
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          {
            IFS= read -r pkg_name
            IFS= read -r bin_name
            IFS= read -r pkg_desc
            IFS= read -r pkg_license
            IFS= read -r pkg_home
          } < <(
            cargo metadata --no-deps --format-version 1 | jq -r --arg name "$PKG_NAME" '
              (.packages[] | select(.name == $name)) as $p |
              $p.name,
              ((first($p.targets[] | select(.kind | index("bin")) | .name)) // $p.name),
              ($p.description // ""),
              ($p.license // ""),
              ($p.homepage // $p.repository)
            '
          )
          test -n "$pkg_name" && test -n "$bin_name"
          formula_class=$(printf '%s' "$pkg_name" | awk -F'[-_]' '{for(i=1;i<=NF;i++) printf toupper(substr($i,1,1)) substr($i,2)}')

          sha_mac_arm=$(sha256sum "artifacts/${pkg_name}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          sha_lin_x64=$(sha256sum "artifacts/${pkg_name}-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          sha_lin_arm=$(sha256sum "artifacts/${pkg_name}-aarch64-unknown-linux-gnu.tar.gz" | awk '{print $1}')

          mkdir -p tap/Formula
          cat > "tap/Formula/${pkg_name}.rb" <<EOF
          class ${formula_class} < Formula
            desc "${pkg_desc}"
            homepage "${pkg_home}"
            version "${version}"
            license "${pkg_license}"

            on_macos do
              on_arm do
                url "https://github.com/${REPO}/releases/download/${TAG}/${pkg_name}-aarch64-apple-darwin.tar.gz"
                sha256 "${sha_mac_arm}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/${REPO}/releases/download/${TAG}/${pkg_name}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${sha_lin_arm}"
              end
              on_intel do
                url "https://github.com/${REPO}/releases/download/${TAG}/${pkg_name}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${sha_lin_x64}"
              end
            end

            def install
              bin.install "${bin_name}"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/${bin_name} --version")
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/${pkg_name}.rb"
          git commit -m "${pkg_name} ${version}"
          git push "https://x-access-token:${TAP_TOKEN}@github.com/${HOMEBREW_TAP}.git" HEAD
